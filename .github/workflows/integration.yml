name: Integration Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  integration:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Install package
      run: uv sync --group dev

    - name: Run integration tests
      run: |
        mkdir -p integration_test
        cd integration_test

        uv run codepg create test_file.py --no-editor

        uv run codepg config --init
        uv run codepg config --show

        if [ "$RUNNER_OS" == "Windows" ]; then
          PYPATH=$(find "$HOME/CodePG" -name "test_file.py" | head -n 1)
          if [ -z "$PYPATH" ]; then
            echo "Failed to create test file"
            exit 1
          else
            echo "Successfully created: $PYPATH"
            cat "$PYPATH"
          fi
        else
          PYPATH=$(find $HOME/CodePG -name "test_file.py" | head -n 1)
          if [ -z "$PYPATH" ]; then
            echo "Failed to create test file"
            exit 1
          else
            echo "Successfully created: $PYPATH"
            cat "$PYPATH"
          fi
        fi
      shell: bash
