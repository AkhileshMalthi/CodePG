name: Compatibility Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.13']
        include:
          - os: ubuntu-latest
            python-version: '3.11'
            toxenv: py311
          - os: ubuntu-latest
            python-version: '3.13'
            toxenv: py313
          - os: windows-latest
            python-version: '3.11'
            toxenv: py311
          - os: windows-latest
            python-version: '3.13'
            toxenv: py313
          - os: macos-latest
            python-version: '3.11'
            toxenv: py311
          - os: macos-latest
            python-version: '3.13'
            toxenv: py313

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Install dependencies
      run: uv sync --group dev

    - name: Verify package installation
      run: |
        uv run codepg --help
        uv run codepg create test_file.py --no-editor
      shell: bash
