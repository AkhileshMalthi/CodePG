[tool.poetry]
name = "codepg"
version = "0.1.0"
description = "Automates File creation for Running Codes specific to programming languages. Useful tool for beginner programmers learning programming languages."
authors = ["Akhilesh Malhti <akhileshmalthi2299@gmail.com>"]
license = "MIT"
readme = "README.md"
packages = [{include = "codepg"}]

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
langchain = "^0.1.0"
langchain-core = "^0.1.8"
langchain-groq = "^0.1.0"  # Keep only langchain-groq
crewai = "^0.28.0"
ollama = "^0.1.6"
python-dotenv = "^1.0.0"
groq = "^0.18.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0.0"
pytest-cov = "^4.0.0"
black = "^23.3.0"
isort = "^5.12.0"
mypy = "^1.3.0"
flake8 = "^6.0.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
codepg = "codepg.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "--cov=codepg --cov-report=xml --cov-report=term"

[tool.black]
line-length = 100
target-version = ["py37", "py38", "py39", "py310", "py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3

[tool.mypy]
python_version = "3.7"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
