[tool.poetry]
name = "codepg"
version = "1.0.0"
description = "Automates File creation for Running Codes specific to programming languages. Useful tool for beginner programmers learning programming languages."
authors = ["Akhilesh Malhti <akhileshmalthi2299@gmail.com>"]
license = "MIT"
readme = "README.md"
packages = [{include = "codepg"}]

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
groq = "^0.18.0"
ollama = "^0.1.6"
python-dotenv = "^1.0.0"
pyyaml = "^6.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0.0"
pytest-cov = "^4.0.0"
ruff = "^0.1.0"
mypy = "^1.3.0"
pre-commit = "^3.0.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
codepg = "codepg.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "--cov=codepg --cov-report=xml --cov-report=term"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by formatter
]

[tool.ruff.lint.isort]
known-first-party = ["codepg"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
